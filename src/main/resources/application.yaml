spring:
  application:
    name: content-community-engine

    datasource:
      url: jdbc:postgresql://localhost:5433/content_engine_db
      username: engine_user
      password: secret
      driver-class-name: org.postgresql.Driver

    jpa:
      open-in-view: false
      show-sql: true
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          format_sql: true

    flyway:
      enabled: true
      baseline-on-migrate: true
      locations: classpath:db/migration
